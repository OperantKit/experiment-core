[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experiment-core"
version = "0.1.0a0"
description = "Experimental orchestration core for operantkit: Session lifecycle, ExperimentContext, Renewal (ABA/AAB/ABC). Imports schedule runtime via Protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "operantkit contributors" }]
dependencies = [
    "contingency-dsl-py",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "black",
]

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit-level tests",
    "integration: integration-level tests spanning modules",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
